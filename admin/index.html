<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Панель записи</title>
<style>
  :root { --accent:#1a73e8; --accent-soft:#e8f0fe; --bg:#f6f7f9; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb;
          --open:#1e8e3e; --open-soft:#e6f4ea; --booked:#1a73e8; --busy:#b06000; --busy-soft:#fef7e0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:17px; margin:0 0 12px; }
  .muted { color:var(--muted); font-size:13px; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; color:var(--text); }
  .btn:hover { border-color:#c7cbd1; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.danger { color:#c62828; }
  .btn:disabled { opacity:.5; cursor:default; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .stat .v { font-size:30px; font-weight:700; line-height:1.1; }
  .stat .l { color:var(--muted); font-size:13px; margin-top:4px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:12px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:5px; border:1px solid var(--line); }
  .day { border-top:1px solid var(--line); padding:12px 0; }
  .day:first-of-type { border-top:0; }
  .dayhead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .dayname { font-weight:600; min-width:150px; }
  .tag { font-size:11px; padding:2px 7px; border-radius:20px; background:#f1f3f4; color:var(--muted); }
  .tag.custom { background:var(--accent-soft); color:var(--accent); }
  .tag.closed { background:#fce8e6; color:#c62828; }
  .daybtns { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
  .save { font-size:12px; color:var(--muted); min-width:80px; text-align:right; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:#fff; color:#9aa0a6; border-radius:7px; padding:6px 0; width:62px; text-align:center; font-size:13px; cursor:pointer; user-select:none; position:relative; }
  .chip.open { background:var(--open-soft); border-color:#a8dab5; color:var(--open); font-weight:600; }
  .chip.busy { background:repeating-linear-gradient(45deg,var(--busy-soft),var(--busy-soft) 4px,#fff 4px,#fff 8px); border-color:#f6d37a; color:var(--busy); }
  .chip.busy.open { font-weight:600; }
  .chip.booked { background:var(--booked); border-color:var(--booked); color:#fff; cursor:default; font-weight:600; }
  .chip.past { opacity:.35; cursor:default; }
  .chip:not(.booked):not(.past):hover { border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:500; }
  td a { color:var(--accent); text-decoration:none; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:820px) { .two { grid-template-columns:1fr; } .dayname { min-width:0; } }
  input[type=text], input[type=password] { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  ol { padding-left:20px; margin:8px 0 12px; line-height:1.6; }
  .ok { color:var(--open); font-weight:600; }
  .err { color:#c62828; }
  .gate { max-width:420px; margin:80px auto; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#202124; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .empty { color:var(--muted); padding:8px 0; }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="muted">Загрузка…</div></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzRrolK0nPeMpJh1Pkq9ufHCcDjweofBR6cVlCnaxYe3OCHvROVXjbYm8fOpIICY4rDow/exec';
const LS = 'zapisAdminKey';
let KEY = null, DATA = null, tgHint = '';
const pending = {};      // dayKey -> timer
const draft = {};        // dayKey -> Set открытых слотов (локальные изменения до сохранения)
const ver = {};          // dayKey -> номер последнего изменения

function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} }
function load(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }

// ключ из ссылки вида .../admin/#k=XXXX — сохраняем и убираем из адресной строки
(function () {
  const m = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (m) { store(LS, m[1]); history.replaceState(null, '', location.pathname); }
  KEY = load(LS);
})();

function call(action, extra) {
  return fetch(API, {
    method: 'POST', credentials: 'omit',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action, key: KEY }, extra || {})),
  }).then(r => r.json()).then(r => {
    if (r && r.ok === false) throw new Error(r.error || 'Ошибка');
    return r;
  });
}

function gate(msg) {
  document.getElementById('root').innerHTML =
    '<div class="card gate"><h2>Панель записи</h2><p class="muted">Введите ключ доступа.</p>' +
    (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
    '<input type="password" id="k" placeholder="Ключ"><div style="margin-top:10px"><button class="btn primary" id="go">Войти</button></div></div>';
  const go = () => { KEY = document.getElementById('k').value.trim(); store(LS, KEY); refresh(); };
  document.getElementById('go').onclick = go;
  document.getElementById('k').onkeydown = e => { if (e.key === 'Enter') go(); };
}

function refresh() {
  if (!KEY) return gate();
  call('admin_overview').then(r => { DATA = r; render(); }).catch(e => {
    if (/ключ/i.test(e.message)) { store(LS, null); KEY = null; gate(e.message); }
    else document.getElementById('root').innerHTML = '<div class="card err">Не удалось загрузить данные: ' + esc(e.message) + ' <button class="btn" onclick="refresh()">Повторить</button></div>';
  });
}

function dayLabel(key) {
  const [y, m, d] = key.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const s = dt.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function fmtDT(iso) {
  return new Date(iso).toLocaleString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' });
}
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'только что';
  if (m < 60) return m + ' мин назад';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' ч назад';
  return Math.round(h / 24) + ' дн. назад';
}

function render() {
  const d = DATA, s = d.stats;
  let h = '<header><div><h1>Панель записи</h1><div class="muted">Встреча ' + d.duration + ' мин · время по Берлину</div></div>' +
    '<div style="display:flex;gap:8px"><a class="btn" href="../" target="_blank" style="text-decoration:none">Открыть страницу записи</a>' +
    '<button class="btn" onclick="refresh()">Обновить</button></div></header>';

  h += '<div class="stats">' +
    stat(s.createdToday, 'записались сегодня') + stat(s.created7, 'записей за 7 дней') +
    stat(s.upcoming, 'предстоящих встреч') + stat(s.meetingsToday, 'встреч ещё сегодня') + '</div>';

  // окна
  h += '<div class="card"><h2>Окна для записи — ' + d.days.length + ' дней</h2>' +
    '<div class="muted" style="margin-bottom:10px">Нажмите на время, чтобы открыть или закрыть его. Изменения сохраняются сами. ' +
    'Людям на странице записи видны ближайшие ' + d.publicDays + ' дн.</div>' +
    '<div class="legend"><span><i style="background:var(--open-soft);border-color:#a8dab5"></i>открыто</span>' +
    '<span><i></i>закрыто</span><span><i style="background:var(--booked);border-color:var(--booked)"></i>записан человек</span>' +
    '<span><i style="background:repeating-linear-gradient(45deg,#fef7e0,#fef7e0 3px,#fff 3px,#fff 6px);border-color:#f6d37a"></i>занято другим событием в календаре</span></div>';
  d.days.forEach(day => { h += dayHtml(day); });
  h += '</div>';

  // списки
  h += '<div class="two"><div class="card"><h2>Ближайшие встречи</h2>' + upcomingHtml(d.upcoming) + '</div>' +
       '<div class="card"><h2>Последние записи</h2>' + recentHtml(d.recent) + '</div></div>';

  h += '<div class="card"><h2>Уведомления</h2>' + notifyHtml(d.telegram) + '</div>';

  h += '<div class="muted" style="text-align:center;margin-top:20px"><a href="#" onclick="store(LS,null);location.reload();return false" style="color:inherit">Выйти из панели на этом устройстве</a></div>';
  document.getElementById('root').innerHTML = h;
}

function stat(v, l) { return '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }

function openSet(day) { return draft[day.key] || new Set(day.slots.filter(x => x.open).map(x => x.t)); }

function dayHtml(day) {
  const open = openSet(day);
  let tags = '';
  if (!day.inPublicWindow) tags += '<span class="tag">пока не виден людям</span>';
  if (day.custom) tags += '<span class="tag custom">настроено вручную</span>';
  if (!open.size) tags += '<span class="tag closed">день закрыт</span>';
  let h = '<div class="day" id="day-' + day.key + '"><div class="dayhead"><span class="dayname">' + dayLabel(day.key) + '</span>' + tags +
    '<span class="daybtns"><span class="save" id="save-' + day.key + '"></span>' +
    '<button class="btn" onclick="closeDay(\'' + day.key + '\')"' + (open.size ? '' : ' disabled') + '>Закрыть день</button>' +
    '<button class="btn" onclick="resetDay(\'' + day.key + '\')"' + (day.custom ? '' : ' disabled') + '>Стандартное расписание</button></span></div><div class="chips">';
  day.slots.forEach(x => {
    const cls = ['chip'];
    if (x.booked) cls.push('booked');
    else { if (open.has(x.t)) cls.push('open'); if (x.busy) cls.push('busy'); }
    if (x.past) cls.push('past');
    const title = x.booked ? 'Записан: ' + x.booked : x.busy ? 'В календаре: ' + x.busy : (open.has(x.t) ? 'Открыто — нажмите, чтобы закрыть' : 'Закрыто — нажмите, чтобы открыть');
    const click = (x.booked || x.past) ? '' : ' onclick="toggle(\'' + day.key + '\',\'' + x.t + '\')"';
    h += '<span class="' + cls.join(' ') + '" title="' + esc(title) + '"' + click + '>' + x.t + '</span>';
  });
  return h + '</div></div>';
}

function findDay(key) { return DATA.days.find(d => d.key === key); }
function rerenderDay(key) {
  const el = document.getElementById('day-' + key);
  if (el) el.outerHTML = dayHtml(findDay(key));
}
function setSave(key, text) { const el = document.getElementById('save-' + key); if (el) el.textContent = text; }

function toggle(key, t) {
  const day = findDay(key);
  const set = new Set(openSet(day));
  set.has(t) ? set.delete(t) : set.add(t);
  draft[key] = set; ver[key] = (ver[key] || 0) + 1;
  rerenderDay(key); setSave(key, 'сохраняю…');
  clearTimeout(pending[key]);
  pending[key] = setTimeout(() => saveDay(key, { slots: Array.from(draft[key]) }), 700);
}
function closeDay(key) {
  draft[key] = new Set(); ver[key] = (ver[key] || 0) + 1; rerenderDay(key); setSave(key, 'сохраняю…');
  clearTimeout(pending[key]); saveDay(key, { slots: [] });
}
function resetDay(key) {
  delete draft[key]; ver[key] = (ver[key] || 0) + 1; setSave(key, 'сохраняю…');
  clearTimeout(pending[key]); saveDay(key, { reset: true });
}
function saveDay(key, body) {
  const v = ver[key];
  call('admin_set_day', Object.assign({ date: key }, body)).then(r => {
    DATA = r;
    if (ver[key] !== v) return;           // пока сохраняли, вы уже нажали ещё — дождёмся следующего сохранения
    delete draft[key];
    rerenderDay(key); setSave(key, 'сохранено ✓');
    setTimeout(() => setSave(key, ''), 1800);
  }).catch(e => { setSave(key, ''); toast('Не сохранилось: ' + e.message); });
}

function upcomingHtml(list) {
  if (!list.length) return '<div class="empty">Пока никто не записан.</div>';
  return '<table><tr><th>Когда</th><th>Кто</th><th></th></tr>' + list.map(b =>
    '<tr><td style="white-space:nowrap">' + esc(fmtDT(b.start)) + '</td><td>' + esc(b.name || '—') + '<div class="muted">' + esc(b.email) + '</div>' +
    (b.declined ? '<div class="err" style="font-size:12px">отклонил приглашение</div>' : '') + '</td><td style="white-space:nowrap">' +
    (b.meet ? '<a href="' + esc(b.meet) + '" target="_blank">Meet</a>' : '') + (b.link ? ' · <a href="' + esc(b.link) + '" target="_blank">Календарь</a>' : '') +
    '</td></tr>').join('') + '</table>';
}
function recentHtml(list) {
  if (!list.length) return '<div class="empty">Записей пока нет.</div>';
  return '<table><tr><th>Записался</th><th>Кто</th><th>На когда</th></tr>' + list.map(b =>
    '<tr><td style="white-space:nowrap">' + esc(ago(b.created)) + '</td><td>' + esc(b.name || '—') + '<div class="muted">' + esc(b.email) + '</div></td><td style="white-space:nowrap">' + esc(fmtDT(b.start)) + '</td></tr>').join('') + '</table>';
}

function notifyHtml(tg) {
  let h = '<p><b>Почта:</b> <span class="ok">включено</span> — письмо «Новая запись» приходит на почту владельца календаря.</p>';
  h += '<p><b>Telegram:</b> ';
  if (tg.connected) {
    h += '<span class="ok">подключено</span>' + (tg.bot ? ' — бот @' + esc(tg.bot) : '') + '</p>' +
      '<button class="btn danger" onclick="tgOff()">Отключить Telegram</button>';
    return h;
  }
  h += 'не подключено</p>';
  if (tg.hasToken) {
    h += '<p>Бот ' + (tg.bot ? '<b>@' + esc(tg.bot) + '</b> ' : '') + 'найден. Откройте его в Telegram, нажмите <b>Start</b> (или напишите любое сообщение), затем нажмите «Проверить».</p>' +
      (tgHint ? '<p class="err">' + esc(tgHint) + '</p>' : '') +
      '<button class="btn primary" id="tgcheck" onclick="tgLink()">Проверить</button> <button class="btn" onclick="tgOff()">Ввести другой токен</button>';
    return h;
  }
  h += '<ol><li>В Telegram откройте <b>@BotFather</b> и отправьте <code>/newbot</code>.</li>' +
    '<li>Придумайте имя и адрес бота (адрес должен заканчиваться на <code>bot</code>).</li>' +
    '<li>BotFather пришлёт токен вида <code>123456789:AA…</code>. Скопируйте его сюда.</li></ol>' +
    (tgHint ? '<p class="err">' + esc(tgHint) + '</p>' : '') +
    '<input type="text" id="tgtoken" placeholder="Токен бота"><div style="margin-top:10px"><button class="btn primary" id="tgcheck" onclick="tgLink(true)">Подключить</button></div>';
  return h;
}
function tgLink(withToken) {
  const btn = document.getElementById('tgcheck'); if (btn) { btn.disabled = true; btn.textContent = 'Проверяю…'; }
  const extra = withToken ? { token: (document.getElementById('tgtoken') || {}).value || '' } : {};
  call('admin_tg', extra).then(r => {
    DATA = r;
    tgHint = r.tgNeedMessage && !withToken ? 'Бот пока не получил от вас сообщения. Нажмите Start в чате с ботом и попробуйте ещё раз.' : '';
    render();
    if (r.telegram.connected) toast('Telegram подключён — проверьте сообщение от бота');
  }).catch(e => { tgHint = e.message; render(); });
}
function tgOff() { call('admin_tg_off').then(r => { DATA = r; tgHint = ''; render(); }).catch(e => toast(e.message)); }

refresh();
</script>
</body>
</html>
